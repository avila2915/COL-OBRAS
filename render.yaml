services:
  - type: web
    name: col-obras-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: COMPANY_EMAIL
        value: col.obrasingarq@gmail.com
      - key: SMTP_TLS_REJECT_UNAUTHORIZED
        value: "false"
